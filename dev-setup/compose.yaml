# Dev environment for fee-service, on one network:
#   restate   the dev Restate server
#   postgres  the dev PostgreSQL, where the app records the fees
#   dev       the sandboxed dev container (JDK, Maven, Claude Code, nested podman for Testcontainers)
# On the host:  podman compose up -d --build   then   podman compose exec dev bash
# Details: README.md
name: fee-service

services:
  restate:
    # TODO pin 1.8.1, the version the tests use (RestateTestEnvironment) with SDK 2.9.3
    image: docker.restate.dev/restatedev/restate:latest
    container_name: fee-service-restate
    ports:
      - "127.0.0.1:8080:8080"   # ingress
      - "127.0.0.1:9070:9070"   # admin API and UI: http://localhost:9070

  postgres:
    # the version the tests use (PostgresTestEnvironment)
    image: docker.io/library/postgres:18.7
    container_name: fee-service-postgres
    environment:
      # the app's packaged defaults (application.yml: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD)
      POSTGRES_DB: fee
      POSTGRES_USER: fee
      POSTGRES_PASSWORD: fee
    ports:
      - "127.0.0.1:5432:5432"   # for the app on the host (IDE, profile local) and psql
    volumes:
      # Postgres 18 images keep their data below /var/lib/postgresql (PGDATA is a versioned directory inside it)
      - postgres-data:/var/lib/postgresql

  dev:
    build:
      context: .
      args:
        USER_NAME: ${USER}      # the container user mirrors yours, so home paths match the host
    image: localhost/fee-service-dev
    container_name: fee-service-dev
    hostname: sandboxed-dev
    command: ["sleep", "infinity"]
    init: true
    # The image's user has UID/GID 1000. keep-id maps it to your host user, whatever your host UID is.
    userns_mode: "keep-id:uid=1000,gid=1000"
    cap_drop: [ALL]
    # SETUID, SETGID: newuidmap/newgidmap need them to set up the nested podman's user namespace.
    # SYS_CHROOT: the default seccomp profile allows chroot(2) only with this capability, and the nested podman unpacks
    # image layers in a chroot. Without it every pull fails with "after fallback to chroot: operation not permitted".
    # They apply inside this container's own user namespace and grant nothing on the host.
    cap_add: [SETUID, SETGID, SYS_CHROOT]
    devices:
      - /dev/fuse               # fuse-overlayfs fallback for nested image storage
      - /dev/net/tun            # pasta networking for nested containers
    # unmask=/proc/sys: netavark sets net.ipv4.ip_forward in the nested podman's own network namespace, which the bridge
    # network needs (Testcontainers puts its containers there, and exposeHostPorts needs container-to-container traffic).
    # The kernel still allows writes only to net.* sysctls of network namespaces this container owns; global kernel
    # settings stay read-only.
    security_opt: ["label=disable", "unmask=/proc/sys"]
    pids_limit: 4096
    ports:
      - "127.0.0.1:8081:8081"   # the app's HTTP API, for curl from the host
    working_dir: /workspace/project
    environment:
      HOME: /home/${USER}
      # The dev Restate above. The app registers its endpoint there as dev:9080, reached over this network, so 9080 isn't
      # published. Tests ignore these and start their own Restate.
      RESTATE_INGRESS_URL: http://restate:8080
      RESTATE_ADMIN_URL: http://restate:9070
      RESTATE_ADVERTISED_HOST: dev
      # The dev Postgres above, over this network. Tests ignore it and start their own
      DATABASE_URL: r2dbc:postgresql://postgres:5432/fee
    # The host's podman socket is deliberately not mounted: holding it means controlling the host's podman.
    volumes:
      - ../:/workspace/project:rw,Z
      - type: tmpfs             # hides .git: git runs on the host
        target: /workspace/project/.git
        read_only: true
      - ${HOME}/.m2:/home/${USER}/.m2:rw,z
      # Claude Code's login, settings and memory. The volume is named per compose project (fee-service_claude-state).
      # Don't share it between projects: all of them are mounted at /workspace/project, so their memories would mix.
      - claude-state:/home/${USER}/.claude
      # nested image storage: overlay can't sit on the container's own overlay filesystem
      - containers:/home/${USER}/.local/share/containers
    depends_on: [restate, postgres]

volumes:
  claude-state:
  containers:
  postgres-data:

x-podman:
  in_pod: false                 # keep-id can't be used inside a pod (podman-compose)
