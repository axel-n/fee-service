# The packaged defaults: the only place they are written down. Override them with environment variables, a
# config/application.yml in the working directory, or command-line arguments (docs/design.md, "Configuration").
# Renaming a key or a variable breaks existing override files and environments.

spring:
  application:
    name: fee-service
  # POST /transaction/fee is a suspend function, so Spring MVC serves it asynchronously. FeeService bounds the wait for
  # the result by restate.attach-timeout; 0 turns off the servlet container's own async timeout (30s on Tomcat), which
  # would otherwise cut a longer attach-timeout short with a 503
  mvc:
    async:
      request-timeout: 0
  # PostgreSQL, where the workflow records the fees (the fee_record table). The defaults match the dev Postgres in
  # dev-setup/compose.yaml; elsewhere set the variables. Explicit placeholders, like restate.* below
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/fee}
    username: ${DATABASE_USERNAME:fee}
    password: ${DATABASE_PASSWORD:fee}
  # schema.sql (CREATE TABLE IF NOT EXISTS) runs at every start. That is also the startup check: the app doesn't start
  # when the database can't be reached
  sql:
    init:
      mode: always

server:
  port: 8081

# Explicit placeholders: Spring's automatic mapping would expect RESTATE_INGRESSURL (dashes dropped).
# The app registers its endpoint with Restate at startup as http://<advertised-host>:<endpoint port>, and removes it at
# shutdown unless unfinished invocations still need it.
restate:
  # Restate ingress, used by FeeService to submit and attach to workflows
  ingress-url: ${RESTATE_INGRESS_URL:http://localhost:8080}
  # Restate's admin API, where the endpoint is registered and removed
  admin-url: ${RESTATE_ADMIN_URL:http://localhost:9070}
  # Port the Restate endpoint listens on; Restate calls the workflow here
  endpoint-port: ${RESTATE_ENDPOINT_PORT:9080}
  # Host Restate reaches the endpoint at: localhost only when Restate runs on this machine outside a container
  advertised-host: ${RESTATE_ADVERTISED_HOST:localhost}
  # How long POST /transaction/fee waits for the workflow's result; then it answers 504 only if Restate reports the run
  # as not finished (470)
  attach-timeout: ${RESTATE_ATTACH_TIMEOUT:30s}

# The local cache of charged fees: FeeService answers a charged transaction_id from it, then from Postgres, before it
# asks Restate. Charged fees never change, so the size and expiry only bound its memory
fee-cache:
  # How many charged fees it holds at most
  maximum-size: ${FEE_CACHE_MAXIMUM_SIZE:1000}
  # How long a charged fee stays after it was put there
  expire-after-write: ${FEE_CACHE_EXPIRE_AFTER_WRITE:1d}
  # How long FeeService waits for Postgres on a cache miss. Past it, as on a failed read, it asks Restate, which answers
  # every transaction_id correctly: a database that hangs (a network partition) can't hold requests up
  lookup-timeout: ${FEE_CACHE_LOOKUP_TIMEOUT:1s}

# Fee numbers per transaction type, read by the *FeeProperties classes; descriptions are built from them.
# Rates are fractions in [0, 1); min and fixed are amounts in the transaction's asset (USD or EUR, same numbers).
# Quoted, so they reach BigDecimal as strings. A missing or invalid value fails startup.
fee:
  mobile-top-up:
    rate: "0.0015"
  bank-transfer:
    rate: "0.005"
    min: "1.00"
  merchant-payment:
    rate: "0.01"
    fixed: "0.30"
  cash-withdrawal:
    fixed: "2.00"
